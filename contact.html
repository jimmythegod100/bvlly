<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rock+Salt&family=Space+Grotesk:wght@400;500;600;700&family=UnifrakturMaguntia&display=swap">
  <title>Contact | BVLLY</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/brand.css?v=20261029a">
  <link rel="stylesheet" href="css/main.css?v=20261029a">
</head>
<body data-page="contact">
  <header class="site-header" data-site-header></header>

  <main>
    <div class="contact-strip" data-contact-strip></div>

    <div class="contact-main">
      <h1>Join the drop</h1>
      <p>Early access to the pink &amp; black drop. No checkout on this draft.</p>

      <div class="form-card">
        <form data-contact-form method="POST">
          <input type="hidden" name="_subject" value="">
          <input type="hidden" name="_next" value="">
          <input type="hidden" name="_captcha" value="false">
          <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

          <div class="form-group">
            <label for="name">Full name *</label>
            <input type="text" id="name" name="name" required autocomplete="name" placeholder="Enter your full name">
          </div>
          <div class="form-group">
            <label for="email">Email address *</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="Enter your email address">
          </div>
          <div class="form-group">
            <span class="form-label">Piece of interest *</span>
            <div class="radio-list" data-piece-radios></div>
          </div>
          <div class="form-group">
            <label for="size">Size</label>
            <select id="size" name="size"></select>
          </div>
          <div class="form-group">
            <label for="color">Color</label>
            <select id="color" name="color"></select>
          </div>
          <div class="form-group">
            <label for="message">Message *</label>
            <textarea id="message" name="message" required placeholder="Size, city, and what you want from the drop."></textarea>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Send</button>
          <p class="form-note">FormSubmit delivers this to the label inbox. First submission sends an activation email.</p>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer" data-site-footer></footer>

  <script src="js/site-config.js?v=20261029a"></script>
  <script src="js/catalog.js?v=20261029a"></script>
  <script src="js/layout.js?v=20261029a"></script>
  <script src="js/cart.js?v=20261029a"></script>
</body>
</html>
