<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=UnifrakturMaguntia&display=swap">
  <title>Contact — {{BRAND}}</title>
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-page="contact">
  <header class="site-header" data-site-header></header>

  <main>
    <div class="page-header">
      <div class="container">
        <h1>Join the drop</h1>
        <p>Waitlist, wholesale, or a sizing question. No checkout on this draft.</p>
      </div>
    </div>

    <section class="section">
      <div class="container contact-grid">
        <div class="contact-info" data-contact-info></div>

        <div class="form-card">
          <form data-contact-form method="POST">
            <input type="hidden" name="_subject" value="">
            <input type="hidden" name="_next" value="">
            <input type="hidden" name="_captcha" value="false">
            <input type="text" name="_honey" style="display:none">

            <div class="form-group">
              <label for="name">Your name</label>
              <input type="text" id="name" name="name" required autocomplete="name">
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="form-group">
              <label for="piece">Piece of interest</label>
              <select id="piece" name="piece"></select>
            </div>
            <div class="form-group">
              <label for="size">Size</label>
              <select id="size" name="size"></select>
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" required placeholder="Size, city, and what you want from the drop."></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Send</button>
            <p class="form-note">FormSubmit delivers this to the label inbox. First submission sends an activation email.</p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-site-footer></footer>

  <script src="js/site-config.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
